<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="auto">
  <defs>
    <!-- Background Gradient: Espresso Velvet -->
    <linearGradient id="charter-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180D12" />
      <stop offset="100%" stop-color="#24131B" />
    </linearGradient>

    <!-- Document Card Surface Gradient -->
    <linearGradient id="sheet-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D1722" />
      <stop offset="100%" stop-color="#1F1017" />
    </linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&amp;family=Space+Mono:wght@400;700&amp;display=swap');

      .huge-title { font-family: 'Space Grotesk', sans-serif; font-weight: 800; }
      .mono { font-family: 'Space Mono', monospace; }
      .grotesk { font-family: 'Space Grotesk', sans-serif; }

      /* Animated Signal Flow along the Bezier Curve */
      .curve-flow {
        stroke-dasharray: 8 6;
        animation: flowCurve 3s linear infinite;
      }
      @keyframes flowCurve {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -28; }
      }

      /* Animated Destination Beacon */
      .beacon-ring-1 {
        animation: beaconRing1 2.8s infinite ease-out;
        transform-origin: 1020px 280px;
      }
      .beacon-ring-2 {
        animation: beaconRing2 2.8s infinite ease-out 1s;
        transform-origin: 1020px 280px;
      }
      @keyframes beaconRing1 {
        0% { transform: scale(0.6); opacity: 1; }
        100% { transform: scale(1.6); opacity: 0; }
      }
      @keyframes beaconRing2 {
        0% { transform: scale(0.6); opacity: 1; }
        100% { transform: scale(1.6); opacity: 0; }
      }

      /* Twinkling Star */
      .star-twinkle {
        animation: starSpin 4s ease-in-out infinite alternate;
        transform-origin: 1020px 280px;
      }
      @keyframes starSpin {
        0% { transform: scale(0.8) rotate(0deg); }
        100% { transform: scale(1.2) rotate(45deg); }
      }
    </style>
  </defs>

  <!-- Container Base -->
  <rect width="1200" height="520" fill="url(#charter-bg)" rx="16" />
  <rect x="1" y="1" width="1198" height="518" fill="none" stroke="#3D242E" stroke-width="1.5" rx="15" />

  <!-- Background Giant Watermark Typography in Espresso Tone -->
  <text x="50" y="240" fill="#28141D" class="huge-title" font-size="220" letter-spacing="-8">
    CRAFT
  </text>

  <!-- Animated Technical Pointer Curve in Deep Burgundy -->
  <path d="M 640 180 Q 860 120 1020 280" fill="none" stroke="#722F37" stroke-width="2" class="curve-flow" />
  
  <!-- Beacon Rings at Destination -->
  <circle cx="1020" cy="280" r="18" fill="none" stroke="#722F37" stroke-width="1.5" class="beacon-ring-1" />
  <circle cx="1020" cy="280" r="12" fill="none" stroke="#E8DCC6" stroke-width="1" class="beacon-ring-2" />
  <circle cx="1020" cy="280" r="5" fill="#722F37" />

  <!-- Target Annotation Pill in Deep Burgundy & Cosmic Latte -->
  <g transform="translate(920, 310)">
    <rect width="200" height="42" rx="6" fill="#24131B" stroke="#4D2735" stroke-width="1.2" />
    <text x="18" y="25" fill="#E8DCC6" class="mono" font-size="10.5" font-weight="700">STATUS: PRODUCTION READY ✦</text>
  </g>

  <!-- ==================== TECHNICAL DOCUMENT MEMO SHEET ==================== -->
  <!-- Layered Shadow Sheet (Back) -->
  <rect x="126" y="56" width="530" height="420" rx="4" fill="#140A0F" stroke="#331A24" stroke-width="1" />

  <!-- Main Card Sheet (Front) -->
  <g transform="translate(118, 48)">
    <rect width="530" height="420" rx="4" fill="url(#sheet-grad)" stroke="#4A2534" stroke-width="1.2" />

    <!-- Sheet Header -->
    <g transform="translate(28, 38)">
      <text x="0" y="0" fill="#B7A89A" class="mono" font-size="11" font-weight="700" letter-spacing="1">PROJECT CHARTER</text>
      
      <!-- Tabs on Right -->
      <text x="290" y="0" fill="#E8DCC6" class="mono" font-size="11" font-weight="700">CHARTER</text>
      <line x1="290" y1="6" x2="346" y2="6" stroke="#722F37" stroke-width="2" />
      <text x="360" y="0" fill="#B7A89A" class="mono" font-size="11">SOP</text>
      <text x="390" y="0" fill="#B7A89A" class="mono" font-size="11">/</text>
      <text x="405" y="0" fill="#B7A89A" class="mono" font-size="11">SPECS</text>
    </g>

    <line x1="28" y1="60" x2="502" y2="60" stroke="#3A1C28" stroke-width="1" />

    <!-- Section 1: Flagship Objective -->
    <g transform="translate(28, 95)">
      <text x="0" y="0" fill="#FAF6EE" class="mono" font-size="12" font-weight="700">1. CORE PHILOSOPHY</text>
      <text x="18" y="24" fill="#B7A89A" class="mono" font-size="11" line-height="1.5">
        <tspan x="18" dy="0">Build software that feels like physical instruments:</tspan>
        <tspan x="18" dy="18">low-latency, predictable, and tactile under fingertips.</tspan>
      </text>
    </g>

    <line x1="28" y1="160" x2="502" y2="160" stroke="#331A24" stroke-width="1" />

    <!-- Section 2: Systems & Interaction -->
    <g transform="translate(28, 195)">
      <text x="0" y="0" fill="#FAF6EE" class="mono" font-size="12" font-weight="700">2. INTERACTION ARCHITECTURE</text>
      <text x="18" y="24" fill="#B7A89A" class="mono" font-size="11" line-height="1.5">
        <tspan x="18" dy="0">Combining high-framerate motion physics (Framer Motion / WebGL)</tspan>
        <tspan x="18" dy="18">with atomic design systems that scale across enterprise apps.</tspan>
      </text>
    </g>

    <line x1="28" y1="260" x2="502" y2="260" stroke="#331A24" stroke-width="1" />

    <!-- Section 3: Engineering Stack & Rules -->
    <g transform="translate(28, 295)">
      <text x="0" y="0" fill="#FAF6EE" class="mono" font-size="12" font-weight="700">3. EXECUTION DIRECTIVES</text>
      <text x="18" y="24" fill="#B7A89A" class="mono" font-size="11" line-height="1.5">
        <tspan x="18" dy="0">Zero layout shifts, sub-100ms response targets, strict WCAG AAA</tspan>
        <tspan x="18" dy="18">contrast compliance, and type-safe frontends with Next.js &amp; TS.</tspan>
      </text>
    </g>

    <line x1="28" y1="360" x2="502" y2="360" stroke="#3A1C28" stroke-width="1" />

    <!-- Sheet Footer -->
    <g transform="translate(28, 392)">
      <text x="0" y="0" fill="#B7A89A" class="mono" font-size="10">v2.5 / Technical Brief</text>
      <text x="325" y="0" fill="#722F37" class="mono" font-size="10" font-weight="700">Design Engineering ✓</text>
    </g>
  </g>
</svg>
