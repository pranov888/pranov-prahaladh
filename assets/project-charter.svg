<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="auto">
  <defs>
    <linearGradient id="charter-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090C" />
      <stop offset="100%" stop-color="#0E1015" />
    </linearGradient>

    <linearGradient id="sheet-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14171E" />
      <stop offset="100%" stop-color="#0F1116" />
    </linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&amp;family=Space+Mono:wght@400;700&amp;display=swap');

      .huge-title { font-family: 'Space Grotesk', -apple-system, sans-serif; font-weight: 800; }
      .mono { font-family: 'Space Mono', monospace; }
      .grotesk { font-family: 'Space Grotesk', -apple-system, sans-serif; }

      .pulse-beacon {
        animation: beaconGlow 2.5s infinite ease-in-out;
      }
      @keyframes beaconGlow {
        0%, 100% { r: 5px; opacity: 1; }
        50% { r: 9px; opacity: 0.35; }
      }
    </style>
  </defs>

  <!-- Container Base -->
  <rect width="1200" height="520" fill="url(#charter-bg)" rx="16" />
  <rect x="1" y="1" width="1198" height="518" fill="none" stroke="#1C2028" stroke-width="1.5" rx="15" />

  <!-- Background Giant Watermark Typography (Image 3 Style) -->
  <text x="50" y="240" fill="#13161C" class="huge-title" font-size="220" letter-spacing="-8">
    CRAFT
  </text>

  <!-- Technical Pointer Curve line in Neon Acid Lime -->
  <path d="M 640 180 Q 860 120 1020 280" fill="none" stroke="#22EC4A" stroke-width="1.5" stroke-dasharray="4 4" />
  <circle cx="1020" cy="280" r="14" fill="none" stroke="#22EC4A" stroke-width="1.2" opacity="0.6" />
  <circle cx="1020" cy="280" r="5" fill="#22EC4A" class="pulse-beacon" />

  <!-- Target Annotation Pill on Right -->
  <g transform="translate(930, 310)">
    <rect width="180" height="42" rx="6" fill="#14171E" stroke="#2B3240" stroke-width="1" />
    <text x="16" y="25" fill="#22EC4A" class="mono" font-size="10.5" font-weight="700">STATUS: PRODUCTION READY</text>
  </g>

  <!-- ==================== TECHNICAL DOCUMENT MEMO SHEET ==================== -->
  <!-- Layered Shadow Sheet (Back) -->
  <rect x="126" y="56" width="530" height="420" rx="4" fill="#0C0D11" stroke="#20252F" stroke-width="1" />

  <!-- Main Card Sheet (Front) -->
  <g transform="translate(118, 48)">
    <rect width="530" height="420" rx="4" fill="url(#sheet-grad)" stroke="#2C3240" stroke-width="1.2" />

    <!-- Sheet Header -->
    <g transform="translate(28, 38)">
      <text x="0" y="0" fill="#9CA3AF" class="mono" font-size="11" font-weight="700" letter-spacing="1">PROJECT CHARTER</text>
      
      <!-- Tabs on Right -->
      <text x="290" y="0" fill="#22EC4A" class="mono" font-size="11" font-weight="700">CHARTER</text>
      <line x1="290" y1="6" x2="346" y2="6" stroke="#22EC4A" stroke-width="1.5" />
      <text x="360" y="0" fill="#5A6170" class="mono" font-size="11">SOP</text>
      <text x="390" y="0" fill="#5A6170" class="mono" font-size="11">/</text>
      <text x="405" y="0" fill="#5A6170" class="mono" font-size="11">SPECS</text>
    </g>

    <line x1="28" y1="60" x2="502" y2="60" stroke="#222733" stroke-width="1" />

    <!-- Section 1: Flagship Objective -->
    <g transform="translate(28, 95)">
      <text x="0" y="0" fill="#FFFFFF" class="mono" font-size="12" font-weight="700">1. CORE PHILOSOPHY</text>
      <text x="18" y="24" fill="#8E96A6" class="mono" font-size="11" line-height="1.5">
        <tspan x="18" dy="0">Build software that feels like physical instruments:</tspan>
        <tspan x="18" dy="18">low-latency, predictable, and tactile under fingertips.</tspan>
      </text>
    </g>

    <line x1="28" y1="160" x2="502" y2="160" stroke="#1D222B" stroke-width="1" />

    <!-- Section 2: Systems & Interaction -->
    <g transform="translate(28, 195)">
      <text x="0" y="0" fill="#FFFFFF" class="mono" font-size="12" font-weight="700">2. INTERACTION ARCHITECTURE</text>
      <text x="18" y="24" fill="#8E96A6" class="mono" font-size="11" line-height="1.5">
        <tspan x="18" dy="0">Combining high-framerate motion physics (Framer Motion / WebGL)</tspan>
        <tspan x="18" dy="18">with atomic design systems that scale across enterprise apps.</tspan>
      </text>
    </g>

    <line x1="28" y1="260" x2="502" y2="260" stroke="#1D222B" stroke-width="1" />

    <!-- Section 3: Engineering Stack & Rules -->
    <g transform="translate(28, 295)">
      <text x="0" y="0" fill="#FFFFFF" class="mono" font-size="12" font-weight="700">3. EXECUTION DIRECTIVES</text>
      <text x="18" y="24" fill="#8E96A6" class="mono" font-size="11" line-height="1.5">
        <tspan x="18" dy="0">Zero layout shifts, sub-100ms response targets, strict WCAG AAA</tspan>
        <tspan x="18" dy="18">contrast compliance, and type-safe frontends with Next.js &amp; TS.</tspan>
      </text>
    </g>

    <line x1="28" y1="360" x2="502" y2="360" stroke="#222733" stroke-width="1" />

    <!-- Sheet Footer -->
    <g transform="translate(28, 392)">
      <text x="0" y="0" fill="#5A6170" class="mono" font-size="10">v2.4 / Technical Brief</text>
      <text x="325" y="0" fill="#22EC4A" class="mono" font-size="10" font-weight="700">Design Engineering ✓</text>
    </g>
  </g>
</svg>
