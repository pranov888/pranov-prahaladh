<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="auto">
  <defs>
    <!-- Background Gradient: Light Mocha Cream -->
    <linearGradient id="charter-light-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F2E8" />
      <stop offset="100%" stop-color="#EFE4D3" />
    </linearGradient>

    <!-- Document Card Surface Gradient -->
    <linearGradient id="sheet-light-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="100%" stop-color="#F2E7D8" />
    </linearGradient>

    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&amp;family=Space+Mono:wght@400;700&amp;display=swap');

      .huge-title { font-family: 'Space Grotesk', sans-serif; font-weight: 800; }
      .mono { font-family: 'Space Mono', monospace; }
      .grotesk { font-family: 'Space Grotesk', sans-serif; }

      /* Animated Signal Flow along the Bezier Curve */
      .curve-flow {
        stroke-dasharray: 8 6;
        animation: flowCurve 3s linear infinite;
      }
      @keyframes flowCurve {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -28; }
      }

      /* Animated Destination Beacon */
      .beacon-ring-1 {
        animation: beaconRing1 2.8s infinite ease-out;
        transform-origin: 1020px 280px;
      }
      .beacon-ring-2 {
        animation: beaconRing2 2.8s infinite ease-out 1s;
        transform-origin: 1020px 280px;
      }
      @keyframes beaconRing1 {
        0% { transform: scale(0.6); opacity: 1; }
        100% { transform: scale(1.6); opacity: 0; }
      }
      @keyframes beaconRing2 {
        0% { transform: scale(0.6); opacity: 1; }
        100% { transform: scale(1.6); opacity: 0; }
      }
    ]]></style>
  </defs>

  <!-- Container Base -->
  <rect width="1200" height="520" fill="url(#charter-light-bg)" rx="16" />
  <rect x="1" y="1" width="1198" height="518" fill="none" stroke="#D6C4AE" stroke-width="1.5" rx="15" />

  <!-- Background Giant Watermark Typography in Soft Cream Silhouette -->
  <text x="50" y="240" fill="#E6D6C0" class="huge-title" font-size="220" letter-spacing="-8">
    PRANOV
  </text>

  <!-- Animated Technical Pointer Curve in Deep Burgundy -->
  <path d="M 640 180 Q 860 120 1020 280" fill="none" stroke="#722F37" stroke-width="2.2" class="curve-flow" />
  
  <!-- Beacon Rings at Destination -->
  <circle cx="1020" cy="280" r="18" fill="none" stroke="#722F37" stroke-width="1.6" class="beacon-ring-1" />
  <circle cx="1020" cy="280" r="12" fill="none" stroke="#B7A89A" stroke-width="1.2" class="beacon-ring-2" />
  <circle cx="1020" cy="280" r="5" fill="#722F37" />

  <!-- Target Annotation Pill with Pranov's live status -->
  <g transform="translate(910, 310)">
    <rect width="220" height="42" rx="6" fill="#FAF7F2" stroke="#D6C4AE" stroke-width="1.4" />
    <text x="14" y="25" fill="#722F37" class="mono" font-size="10.5" font-weight="700">PRANOVDESIGN.VERCEL.APP ✦</text>
  </g>

  <!-- ==================== TECHNICAL DOCUMENT MEMO SHEET ==================== -->
  <!-- Layered Shadow Sheet (Back) -->
  <rect x="126" y="56" width="530" height="420" rx="4" fill="#E4D5BF" stroke="#CBBBA4" stroke-width="1" />

  <!-- Main Card Sheet (Front) -->
  <g transform="translate(118, 48)">
    <rect width="530" height="420" rx="4" fill="url(#sheet-light-grad)" stroke="#C7B49D" stroke-width="1.4" />

    <!-- Sheet Header with Pranov's tabs -->
    <g transform="translate(28, 38)">
      <text x="0" y="0" fill="#886D5B" class="mono" font-size="11" font-weight="700" letter-spacing="1">PRANOV // ARCHITECTURE CHARTER</text>
      
      <!-- Tabs on Right -->
      <text x="270" y="0" fill="#722F37" class="mono" font-size="11" font-weight="700">WHOAMI</text>
      <line x1="270" y1="6" x2="330" y2="6" stroke="#722F37" stroke-width="2" />
      <text x="345" y="0" fill="#886D5B" class="mono" font-size="11">STACK</text>
      <text x="388" y="0" fill="#886D5B" class="mono" font-size="11">/</text>
      <text x="403" y="0" fill="#886D5B" class="mono" font-size="11">PROCESS</text>
    </g>

    <line x1="28" y1="60" x2="502" y2="60" stroke="#D6C4AE" stroke-width="1" />

    <!-- Section 1: Role & Identity from main -->
    <g transform="translate(28, 95)">
      <text x="0" y="0" fill="#241117" class="mono" font-size="12" font-weight="700">1. IDENTITY &amp; CRAFT</text>
      <text x="18" y="24" fill="#6B4F40" class="mono" font-size="11" line-height="1.5">
        <tspan x="18" dy="0">Role: UI/UX Designer &amp; Frontend Developer (Chennai, IN)</tspan>
        <tspan x="18" dy="18">Currently: Building things I can't stop thinking about.</tspan>
      </text>
    </g>

    <line x1="28" y1="160" x2="502" y2="160" stroke="#D6C4AE" stroke-width="1" />

    <!-- Section 2: Core Philosophy from main -->
    <g transform="translate(28, 195)">
      <text x="0" y="0" fill="#241117" class="mono" font-size="12" font-weight="700">2. CORE PHILOSOPHY</text>
      <text x="18" y="24" fill="#6B4F40" class="mono" font-size="11" line-height="1.5">
        <tspan x="18" dy="0">"Design is not how it looks. It's how it works."</tspan>
        <tspan x="18" dy="18">"Good design is obvious. Great design is transparent."</tspan>
      </text>
    </g>

    <line x1="28" y1="260" x2="502" y2="260" stroke="#D6C4AE" stroke-width="1" />

    <!-- Section 3: The Work Standard & Stealth Mode from main -->
    <g transform="translate(28, 295)">
      <text x="0" y="0" fill="#241117" class="mono" font-size="12" font-weight="700">3. EXECUTION DIRECTIVE</text>
      <text x="18" y="24" fill="#6B4F40" class="mono" font-size="11" line-height="1.5">
        <tspan x="18" dy="0">"Until it feels right, it isn't done. Obsess over the rest."</tspan>
        <tspan x="18" dy="18">I debug at midnight and ship before sunrise.</tspan>
      </text>
    </g>

    <line x1="28" y1="360" x2="502" y2="360" stroke="#D6C4AE" stroke-width="1" />

    <!-- Sheet Footer -->
    <g transform="translate(28, 392)">
      <text x="0" y="0" fill="#886D5B" class="mono" font-size="10">v2.5 // Verified Profile</text>
      <text x="310" y="0" fill="#722F37" class="mono" font-size="10" font-weight="700">Pranov Prahaladh ✓</text>
    </g>
  </g>
</svg>
