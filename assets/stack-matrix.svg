<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto">
  <defs>
    <!-- Background Gradient: Light Mocha Cream -->
    <linearGradient id="matrix-light-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F2E8" />
      <stop offset="100%" stop-color="#EFE4D3" />
    </linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&amp;family=Space+Mono:wght@400;700&amp;display=swap');

      .mono { font-family: 'Space Mono', monospace; }
      .grotesk { font-family: 'Space Grotesk', sans-serif; font-weight: 700; }

      /* Floating Rotating Plus Anchor */
      .plus-spin {
        animation: spinPlus 10s linear infinite;
        transform-origin: 24px 180px;
      }
      @keyframes spinPlus {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      /* Pulsing Star on Pill Button */
      .pill-star {
        animation: starBlink 2.5s ease-in-out infinite alternate;
        transform-origin: 1018px 260px;
      }
      @keyframes starBlink {
        0% { transform: scale(0.8) rotate(0deg); opacity: 0.6; }
        100% { transform: scale(1.3) rotate(90deg); opacity: 1; }
      }

      /* Hover/Breathing Pill Glow */
      .pill-border {
        animation: pillGlow 3s ease-in-out infinite alternate;
      }
      @keyframes pillGlow {
        0% { stroke: #722F37; stroke-width: 1.5; }
        100% { stroke: #B7A89A; stroke-width: 2.2; }
      }
    </style>
  </defs>

  <!-- Container Base -->
  <rect width="1200" height="360" fill="url(#matrix-light-bg)" rx="14" />
  <rect x="1" y="1" width="1198" height="358" fill="none" stroke="#D6C4AE" stroke-width="1.5" rx="13" />

  <!-- Grid Dividers in Cosmic Latte Tone (5 columns, 2 rows) -->
  <!-- Horizontal Line -->
  <line x1="40" y1="180" x2="1160" y2="180" stroke="#D6C4AE" stroke-width="1.2" />

  <!-- Vertical Lines -->
  <line x1="264" y1="20" x2="264" y2="340" stroke="#D6C4AE" stroke-width="1.2" />
  <line x1="488" y1="20" x2="488" y2="340" stroke="#D6C4AE" stroke-width="1.2" />
  <line x1="712" y1="20" x2="712" y2="340" stroke="#D6C4AE" stroke-width="1.2" />
  <line x1="936" y1="20" x2="936" y2="340" stroke="#D6C4AE" stroke-width="1.2" />

  <!-- ==================== ROW 1 (Pranov's Interfaces & Languages) ==================== -->
  <!-- Cell 1: Next.js -->
  <g transform="translate(152, 100)" text-anchor="middle">
    <circle cx="0" cy="-22" r="16" fill="none" stroke="#241117" stroke-width="1.6" />
    <path d="M -5 -12 L 6 -32 M 5 -12 L 5 -26" stroke="#241117" stroke-width="1.6" />
    <text x="0" y="22" fill="#241117" class="grotesk" font-size="16">Next.js</text>
    <text x="0" y="38" fill="#785A48" class="mono" font-size="10">APP ROUTER / SSR</text>
  </g>

  <!-- Cell 2: React & React Native -->
  <g transform="translate(376, 100)" text-anchor="middle">
    <ellipse cx="0" cy="-22" rx="18" ry="7" fill="none" stroke="#241117" stroke-width="1.4" />
    <ellipse cx="0" cy="-22" rx="18" ry="7" fill="none" stroke="#241117" stroke-width="1.4" transform="rotate(60, 0, -22)" />
    <ellipse cx="0" cy="-22" rx="18" ry="7" fill="none" stroke="#241117" stroke-width="1.4" transform="rotate(120, 0, -22)" />
    <circle cx="0" cy="-22" r="3" fill="#722F37" />
    <text x="0" y="22" fill="#241117" class="grotesk" font-size="16">React &amp; Native</text>
    <text x="0" y="38" fill="#785A48" class="mono" font-size="10">EXPO / WEB APPS</text>
  </g>

  <!-- Cell 3: TypeScript -->
  <g transform="translate(600, 100)" text-anchor="middle">
    <rect x="-14" y="-36" width="28" height="28" rx="4" fill="none" stroke="#241117" stroke-width="1.6" />
    <text x="0" y="-17" fill="#241117" class="mono" font-size="12" font-weight="700">TS</text>
    <text x="0" y="22" fill="#241117" class="grotesk" font-size="16">TypeScript</text>
    <text x="0" y="38" fill="#785A48" class="mono" font-size="10">STRICT TYPING</text>
  </g>

  <!-- Cell 4: Tailwind CSS -->
  <g transform="translate(824, 100)" text-anchor="middle">
    <path d="M -16 -24 Q -8 -34 0 -24 Q 8 -14 16 -24 Q 8 -10 0 -20 Q -8 -30 -16 -20" fill="none" stroke="#241117" stroke-width="1.6" />
    <text x="0" y="22" fill="#241117" class="grotesk" font-size="16">Tailwind CSS</text>
    <text x="0" y="38" fill="#785A48" class="mono" font-size="10">DESIGN TOKENS</text>
  </g>

  <!-- Cell 5: Three.js & GSAP -->
  <g transform="translate(1048, 100)" text-anchor="middle">
    <polygon points="0,-36 15,-10 -15,-10" fill="none" stroke="#241117" stroke-width="1.6" />
    <circle cx="0" cy="-20" r="3" fill="#722F37" />
    <text x="0" y="22" fill="#241117" class="grotesk" font-size="16">Three.js &amp; GSAP</text>
    <text x="0" y="38" fill="#785A48" class="mono" font-size="10">MOTION DESIGN</text>
  </g>

  <!-- ==================== ROW 2 (Pranov's Services & Design) ==================== -->
  <!-- Cell 6: Python & FastAPI -->
  <g transform="translate(152, 260)" text-anchor="middle">
    <path d="M -12 -30 C -12 -36 0 -36 0 -30 L 0 -22 L -8 -22" fill="none" stroke="#241117" stroke-width="1.5" />
    <path d="M 12 -14 C 12 -8 0 -8 0 -14 L 0 -22 L 8 -22" fill="none" stroke="#241117" stroke-width="1.5" />
    <circle cx="-6" cy="-30" r="1.5" fill="#722F37" />
    <circle cx="6" cy="-14" r="1.5" fill="#722F37" />
    <text x="0" y="22" fill="#241117" class="grotesk" font-size="16">Python &amp; APIs</text>
    <text x="0" y="38" fill="#785A48" class="mono" font-size="10">FASTAPI / DJANGO</text>
  </g>

  <!-- Cell 7: Figma Master -->
  <g transform="translate(376, 260)" text-anchor="middle">
    <circle cx="-6" cy="-30" r="5" fill="none" stroke="#241117" stroke-width="1.4" />
    <circle cx="6" cy="-30" r="5" fill="none" stroke="#241117" stroke-width="1.4" />
    <circle cx="-6" cy="-20" r="5" fill="none" stroke="#241117" stroke-width="1.4" />
    <circle cx="6" cy="-20" r="5" fill="none" stroke="#241117" stroke-width="1.4" />
    <circle cx="-6" cy="-10" r="5" fill="none" stroke="#241117" stroke-width="1.4" />
    <text x="0" y="22" fill="#241117" class="grotesk" font-size="16">Figma &amp; Framer</text>
    <text x="0" y="38" fill="#785A48" class="mono" font-size="10">UI/UX &amp; TOKENS</text>
  </g>

  <!-- Cell 8: PostgreSQL & Supabase -->
  <g transform="translate(600, 260)" text-anchor="middle">
    <ellipse cx="0" cy="-30" rx="14" ry="5" fill="none" stroke="#241117" stroke-width="1.5" />
    <path d="M -14 -30 L -14 -16 A 14 5 0 0 0 14 -16 L 14 -30" fill="none" stroke="#241117" stroke-width="1.5" />
    <circle cx="0" cy="-20" r="2" fill="#722F37" />
    <text x="0" y="22" fill="#241117" class="grotesk" font-size="16">Postgres &amp; DB</text>
    <text x="0" y="38" fill="#785A48" class="mono" font-size="10">SUPABASE / REDIS</text>
  </g>

  <!-- Cell 9 & 10 Interactive Pill Button with Pranov's Handle -->
  <g transform="translate(936, 260)" text-anchor="middle">
    <rect x="-120" y="-24" width="240" height="48" rx="24" fill="#FAF7F2" class="pill-border" />
    <text x="-8" y="5" fill="#722F37" class="mono" font-size="12" font-weight="700">LET'S CONNECT</text>
    <text x="82" y="5" fill="#722F37" class="mono pill-star" font-size="16">✦</text>
  </g>

  <!-- Floating Deep Burgundy Plus Button on Left Boundary -->
  <g transform="translate(24, 180)" class="plus-spin">
    <circle cx="0" cy="0" r="18" fill="#FAF7F2" stroke="#722F37" stroke-width="1.8" />
    <line x1="-7" y1="0" x2="7" y2="0" stroke="#722F37" stroke-width="2.2" />
    <line x1="0" y1="-7" x2="0" y2="7" stroke="#722F37" stroke-width="2.2" />
  </g>
</svg>
