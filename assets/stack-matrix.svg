<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto">
  <defs>
    <linearGradient id="matrix-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090C" />
      <stop offset="100%" stop-color="#0D0F14" />
    </linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&amp;family=Space+Mono:wght@400;700&amp;display=swap');

      .mono { font-family: 'Space Mono', monospace; }
      .grotesk { font-family: 'Space Grotesk', sans-serif; font-weight: 700; }

      .plus-spin:hover {
        transform: rotate(90deg);
      }
    </style>
  </defs>

  <!-- Container -->
  <rect width="1200" height="360" fill="url(#matrix-bg)" rx="14" />
  <rect x="1" y="1" width="1198" height="358" fill="none" stroke="#1C2028" stroke-width="1.5" rx="13" />

  <!-- Grid Dividers (5 columns, 2 rows) -->
  <!-- Horizontal Lines -->
  <line x1="40" y1="180" x2="1160" y2="180" stroke="#1A1D24" stroke-width="1.2" />

  <!-- Vertical Lines -->
  <line x1="264" y1="20" x2="264" y2="340" stroke="#1A1D24" stroke-width="1.2" />
  <line x1="488" y1="20" x2="488" y2="340" stroke="#1A1D24" stroke-width="1.2" />
  <line x1="712" y1="20" x2="712" y2="340" stroke="#1A1D24" stroke-width="1.2" />
  <line x1="936" y1="20" x2="936" y2="340" stroke="#1A1D24" stroke-width="1.2" />

  <!-- ==================== ROW 1 ==================== -->
  <!-- Cell 1: Next.js -->
  <g transform="translate(152, 100)" text-anchor="middle">
    <circle cx="0" cy="-22" r="16" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.8" />
    <path d="M -5 -12 L 6 -32 M 5 -12 L 5 -26" stroke="#FFFFFF" stroke-width="1.4" />
    <text x="0" y="22" fill="#E2E5EB" class="grotesk" font-size="16">Next.js 15</text>
    <text x="0" y="38" fill="#5F6675" class="mono" font-size="10">APP ROUTER / SSR</text>
  </g>

  <!-- Cell 2: React -->
  <g transform="translate(376, 100)" text-anchor="middle">
    <!-- React Atom Icon -->
    <ellipse cx="0" cy="-22" rx="18" ry="7" fill="none" stroke="#FFFFFF" stroke-width="1.3" opacity="0.8" />
    <ellipse cx="0" cy="-22" rx="18" ry="7" fill="none" stroke="#FFFFFF" stroke-width="1.3" opacity="0.8" transform="rotate(60, 0, -22)" />
    <ellipse cx="0" cy="-22" rx="18" ry="7" fill="none" stroke="#FFFFFF" stroke-width="1.3" opacity="0.8" transform="rotate(120, 0, -22)" />
    <circle cx="0" cy="-22" r="3" fill="#22EC4A" />
    <text x="0" y="22" fill="#E2E5EB" class="grotesk" font-size="16">React 19</text>
    <text x="0" y="38" fill="#5F6675" class="mono" font-size="10">CONCURRENT ARCH</text>
  </g>

  <!-- Cell 3: TypeScript -->
  <g transform="translate(600, 100)" text-anchor="middle">
    <rect x="-14" y="-36" width="28" height="28" rx="4" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.8" />
    <text x="0" y="-17" fill="#FFFFFF" class="mono" font-size="12" font-weight="700">TS</text>
    <text x="0" y="22" fill="#E2E5EB" class="grotesk" font-size="16">TypeScript</text>
    <text x="0" y="38" fill="#5F6675" class="mono" font-size="10">STRICT TYPE ENGINE</text>
  </g>

  <!-- Cell 4: Tailwind CSS -->
  <g transform="translate(824, 100)" text-anchor="middle">
    <path d="M -16 -24 Q -8 -34 0 -24 Q 8 -14 16 -24 Q 8 -10 0 -20 Q -8 -30 -16 -20" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8" />
    <text x="0" y="22" fill="#E2E5EB" class="grotesk" font-size="16">Tailwind CSS</text>
    <text x="0" y="38" fill="#5F6675" class="mono" font-size="10">DESIGN TOKENS</text>
  </g>

  <!-- Cell 5: Three.js / WebGL -->
  <g transform="translate(1048, 100)" text-anchor="middle">
    <polygon points="0,-36 15,-10 -15,-10" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.8" />
    <circle cx="0" cy="-20" r="3" fill="#22EC4A" />
    <text x="0" y="22" fill="#E2E5EB" class="grotesk" font-size="16">Three.js / R3F</text>
    <text x="0" y="38" fill="#5F6675" class="mono" font-size="10">3D SHADERS &amp; WEBGL</text>
  </g>

  <!-- ==================== ROW 2 ==================== -->
  <!-- Cell 6: Framer Motion -->
  <g transform="translate(152, 260)" text-anchor="middle">
    <path d="M -12 -34 L 12 -34 L 0 -22 L 12 -10 L 0 -10 L -12 -22 Z" fill="none" stroke="#FFFFFF" stroke-width="1.3" opacity="0.8" />
    <text x="0" y="22" fill="#E2E5EB" class="grotesk" font-size="16">Framer Motion</text>
    <text x="0" y="38" fill="#5F6675" class="mono" font-size="10">PHYSICS INTERACTION</text>
  </g>

  <!-- Cell 7: Figma Systems -->
  <g transform="translate(376, 260)" text-anchor="middle">
    <circle cx="-6" cy="-30" r="5" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.8" />
    <circle cx="6" cy="-30" r="5" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.8" />
    <circle cx="-6" cy="-20" r="5" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.8" />
    <circle cx="6" cy="-20" r="5" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.8" />
    <circle cx="-6" cy="-10" r="5" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.8" />
    <text x="0" y="22" fill="#E2E5EB" class="grotesk" font-size="16">Figma Master</text>
    <text x="0" y="38" fill="#5F6675" class="mono" font-size="10">AUTOLAYOUT / TOKENS</text>
  </g>

  <!-- Cell 8: Python & ML -->
  <g transform="translate(600, 260)" text-anchor="middle">
    <path d="M -12 -30 C -12 -36 0 -36 0 -30 L 0 -22 L -8 -22" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.8" />
    <path d="M 12 -14 C 12 -8 0 -8 0 -14 L 0 -22 L 8 -22" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.8" />
    <circle cx="-6" cy="-30" r="1.5" fill="#22EC4A" />
    <circle cx="6" cy="-14" r="1.5" fill="#22EC4A" />
    <text x="0" y="22" fill="#E2E5EB" class="grotesk" font-size="16">Python &amp; ML</text>
    <text x="0" y="38" fill="#5F6675" class="mono" font-size="10">EEG SIGNAL PROCESSING</text>
  </g>

  <!-- Cell 9 & 10 Interactive Pill Button (Ref 5 Style: 'Your company ✦') -->
  <g transform="translate(936, 260)" text-anchor="middle">
    <rect x="-120" y="-24" width="240" height="48" rx="24" fill="#13161C" stroke="#22EC4A" stroke-width="1.5" />
    <text x="-8" y="5" fill="#FFFFFF" class="mono" font-size="13" font-weight="700">LET'S CONNECT</text>
    <text x="82" y="5" fill="#22EC4A" class="mono" font-size="15">✦</text>
  </g>

  <!-- Floating Green Plus Button on Left Boundary (Exact feature from Image 5) -->
  <g transform="translate(24, 180)">
    <circle cx="0" cy="0" r="18" fill="#0C0E12" stroke="#22EC4A" stroke-width="1.6" />
    <line x1="-7" y1="0" x2="7" y2="0" stroke="#22EC4A" stroke-width="2" />
    <line x1="0" y1="-7" x2="0" y2="7" stroke="#22EC4A" stroke-width="2" />
  </g>
</svg>
