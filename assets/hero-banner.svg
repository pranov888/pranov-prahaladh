<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="auto">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090C" />
      <stop offset="50%" stop-color="#0E1015" />
      <stop offset="100%" stop-color="#08090C" />
    </linearGradient>

    <linearGradient id="pod-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#23262E" />
      <stop offset="100%" stop-color="#14161B" />
    </linearGradient>

    <radialGradient id="green-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22EC4A" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#22EC4A" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161920" stroke-width="0.8" />
      <circle cx="0" cy="0" r="1" fill="#252A34" />
    </pattern>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&amp;family=Space+Mono:ital,wght@0,400;0,700;1,400&amp;family=Newsreader:ital,opsz,wght@1,6..72,500;1,6..72,700&amp;display=swap');

      .mono { font-family: 'Space Mono', monospace; }
      .grotesk { font-family: 'Space Grotesk', -apple-system, sans-serif; }
      .editorial { font-family: 'Newsreader', Georgia, serif; font-style: italic; }

      .blink {
        animation: pulse 2s infinite ease-in-out;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }

      .eq-bar-1 { animation: eq1 1.2s infinite ease-in-out alternate; }
      .eq-bar-2 { animation: eq2 0.9s infinite ease-in-out alternate; }
      .eq-bar-3 { animation: eq3 1.4s infinite ease-in-out alternate; }
      .eq-bar-4 { animation: eq4 1.1s infinite ease-in-out alternate; }
      .eq-bar-5 { animation: eq5 0.8s infinite ease-in-out alternate; }

      @keyframes eq1 { 0% { height: 4px; y: 16px; } 100% { height: 16px; y: 4px; } }
      @keyframes eq2 { 0% { height: 16px; y: 4px; } 100% { height: 6px; y: 14px; } }
      @keyframes eq3 { 0% { height: 8px; y: 12px; } 100% { height: 18px; y: 2px; } }
      @keyframes eq4 { 0% { height: 14px; y: 6px; } 100% { height: 5px; y: 15px; } }
      @keyframes eq5 { 0% { height: 6px; y: 14px; } 100% { height: 15px; y: 5px; } }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="400" fill="url(#grid-pattern)" rx="16" />

  <!-- Outer Hairline Frame -->
  <rect x="1" y="1" width="1198" height="398" fill="none" stroke="#20242D" stroke-width="1.5" rx="15" />

  <!-- Ambient Glow Behind Right Section -->
  <circle cx="950" cy="180" r="160" fill="url(#green-glow)" />

  <!-- Technical Crosshairs & Coordinates -->
  <g stroke="#323846" stroke-width="1">
    <path d="M 30 25 L 45 25 M 37.5 17.5 L 37.5 32.5" />
    <path d="M 1155 25 L 1170 25 M 1162.5 17.5 L 1162.5 32.5" />
    <path d="M 30 375 L 45 375 M 37.5 367.5 L 37.5 382.5" />
    <path d="M 1155 375 L 1170 375 M 1162.5 367.5 L 1162.5 382.5" />
  </g>

  <!-- Header Micro-Navigation Strip -->
  <g transform="translate(60, 48)">
    <circle cx="6" cy="6" r="4.5" fill="#22EC4A" class="blink" />
    <text x="22" y="10" fill="#22EC4A" class="mono" font-size="11" letter-spacing="1.5" font-weight="700">STATUS: OPEN FOR NEW OPPORTUNITIES</text>
    <text x="560" y="10" fill="#5E6573" class="mono" font-size="11" letter-spacing="1.2">SYSTEMS / UI / FRONTEND</text>
    <text x="960" y="10" fill="#88909E" class="mono" font-size="11" letter-spacing="1.5">v2.4 [ACTIVE]</text>
  </g>

  <line x1="60" y1="72" x2="1140" y2="72" stroke="#1C2029" stroke-width="1" />

  <!-- Main Hero Typography -->
  <g transform="translate(60, 160)">
    <!-- Line 1: Identity & Discipline -->
    <text x="0" y="0" fill="#757D8A" class="mono" font-size="12" letter-spacing="2.5" font-weight="600">
      PRANOV PRAHALADH — PRODUCT DESIGNER &amp; FRONTEND ENGINEER
    </text>

    <!-- Line 2: Giant Editorial Headline -->
    <text x="0" y="65" fill="#FFFFFF" class="grotesk" font-size="64" font-weight="700" letter-spacing="-1.5">
      Designer who
    </text>

    <!-- Tactile Audio/Hardware Pod Widget (Image 1 reference) -->
    <g transform="translate(460, 10)">
      <!-- Pod Outer Shell -->
      <rect x="0" y="0" width="220" height="66" rx="33" fill="url(#pod-grad)" stroke="#353B47" stroke-width="1.5" />
      <rect x="3" y="3" width="214" height="60" rx="30" fill="none" stroke="#121418" stroke-width="1" />

      <!-- Left Speaker / Turntable Disc -->
      <circle cx="34" cy="33" r="22" fill="#0C0E12" stroke="#2D333F" stroke-width="1" />
      <circle cx="34" cy="33" r="14" fill="#171A21" stroke="#3A4150" stroke-width="0.8" />
      <circle cx="34" cy="33" r="5" fill="#22EC4A" />

      <!-- Center OLED Mini Screen -->
      <rect x="66" y="18" width="88" height="30" rx="4" fill="#080A0D" stroke="#252A34" stroke-width="0.8" />
      <text x="73" y="29" fill="#22EC4A" class="mono" font-size="7" letter-spacing="0.5">TRACK // 01</text>
      <text x="73" y="41" fill="#CED3DC" class="mono" font-size="7.5" font-weight="700">BUILD WITH PURPOSE</text>

      <!-- Right Speaker with Equalizer -->
      <circle cx="186" cy="33" r="22" fill="#0C0E12" stroke="#2D333F" stroke-width="1" />
      <!-- Animated Equalizer Inside Right Speaker -->
      <g transform="translate(176, 23)" fill="#22EC4A">
        <rect x="0" y="10" width="2.5" height="10" rx="1" class="eq-bar-1" />
        <rect x="5" y="6" width="2.5" height="14" rx="1" class="eq-bar-2" />
        <rect x="10" y="4" width="2.5" height="16" rx="1" class="eq-bar-3" />
        <rect x="15" y="8" width="2.5" height="12" rx="1" class="eq-bar-4" />
        <rect x="20" y="11" width="2.5" height="9" rx="1" class="eq-bar-5" />
      </g>
    </g>

    <!-- Line 2 Continuation: BUILDS in High-Contrast Italics -->
    <text x="705" y="65" fill="#FFFFFF" class="editorial" font-size="74" font-weight="700" letter-spacing="-0.5">
      Builds.
    </text>

    <!-- Manifesto / Core Proposition -->
    <text x="0" y="125" fill="#9CA3AF" class="grotesk" font-size="18" font-weight="400">
      Crafting interfaces that feel like instruments — responsive, precise, and satisfying to use.
    </text>
  </g>

  <!-- Bottom Technical Coordinate Strip -->
  <line x1="60" y1="335" x2="1140" y2="335" stroke="#1C2029" stroke-width="1" />

  <g transform="translate(60, 362)">
    <text x="0" y="0" fill="#565D6B" class="mono" font-size="10" letter-spacing="1">INDEX: [001—004]</text>
    <text x="280" y="0" fill="#565D6B" class="mono" font-size="10" letter-spacing="1">DISCIPLINE: DESIGN SYSTEMS &amp; FRONTEND</text>
    <text x="730" y="0" fill="#565D6B" class="mono" font-size="10" letter-spacing="1">SYSTEM: NEXT.JS · TYPESCRIPT · THREE.JS</text>
    <text x="1000" y="0" fill="#22EC4A" class="mono" font-size="10" font-weight="700" letter-spacing="1">SCROLL ↓</text>
  </g>
</svg>
