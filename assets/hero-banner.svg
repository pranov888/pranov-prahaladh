<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto">
  <defs>
    <!-- Background Gradient: Warm Light Mocha Cream -->
    <linearGradient id="bg-light-mocha" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F3EA" />
      <stop offset="50%" stop-color="#EEDDC7" />
      <stop offset="100%" stop-color="#F5EFE6" />
    </linearGradient>

    <!-- Tactile Hardware Pod Shell -->
    <linearGradient id="pod-light-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF6EE" />
      <stop offset="100%" stop-color="#E4D5BE" />
    </linearGradient>

    <!-- Ambient Burgundy Glow -->
    <radialGradient id="burgundy-ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#722F37" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#722F37" stop-opacity="0" />
    </radialGradient>

    <!-- Celestial Grid Pattern in Cosmic Latte -->
    <pattern id="celestial-grid-light" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E2D4BF" stroke-width="0.8" />
      <circle cx="0" cy="0" r="1.2" fill="#B7A89A" opacity="0.6" />
    </pattern>

    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800;900&family=Space+Mono:wght@400;700&display=swap');
      svg { pointer-events: none; user-select: none; }

      .mono { font-family: 'Space Mono', 'SFMono-Regular', Menlo, Monaco, Consolas, monospace; }
      .grotesk { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .hero-name {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
        letter-spacing: -2.5px;
      }
      .hero-role {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
      }

      /* Animated Turntable Discs */
      .turntable-spin-left {
        animation: spinDisc 8s linear infinite;
        transform-origin: 41px 41px;
      }
      .turntable-spin-right {
        animation: spinDiscRev 10s linear infinite;
        transform-origin: 229px 41px;
      }
      @keyframes spinDisc {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinDiscRev {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }

      /* Animated Equalizer Bars in Deep Burgundy */
      .eq1 { animation: eqAnim1 1.1s infinite ease-in-out alternate; }
      .eq2 { animation: eqAnim2 0.8s infinite ease-in-out alternate; }
      .eq3 { animation: eqAnim3 1.3s infinite ease-in-out alternate; }
      .eq4 { animation: eqAnim4 0.9s infinite ease-in-out alternate; }
      .eq5 { animation: eqAnim5 1.2s infinite ease-in-out alternate; }

      @keyframes eqAnim1 { 0% { height: 4px; y: 18px; } 100% { height: 18px; y: 4px; } }
      @keyframes eqAnim2 { 0% { height: 18px; y: 4px; } 100% { height: 6px; y: 16px; } }
      @keyframes eqAnim3 { 0% { height: 8px; y: 14px; } 100% { height: 20px; y: 2px; } }
      @keyframes eqAnim4 { 0% { height: 16px; y: 6px; } 100% { height: 5px; y: 17px; } }
      @keyframes eqAnim5 { 0% { height: 5px; y: 17px; } 100% { height: 17px; y: 5px; } }

      /* Twinkling Celestial Sparkles */
      .twinkle-1 {
        animation: starTwinkle 3.2s infinite ease-in-out;
        transform-origin: 940px 140px;
      }
      .twinkle-2 {
        animation: starTwinkle 4s infinite ease-in-out 1.2s;
        transform-origin: 1090px 90px;
      }
      .twinkle-3 {
        animation: starTwinkle 3.6s infinite ease-in-out 2s;
        transform-origin: 820px 240px;
      }
      @keyframes starTwinkle {
        0%, 100% { transform: scale(0.8) rotate(0deg); opacity: 0.5; }
        50% { transform: scale(1.3) rotate(90deg); opacity: 1; }
      }
    ]]></style>
  </defs>

  <!-- Container Base with Light Mocha Cream Background -->
  <rect width="1200" height="360" fill="url(#bg-light-mocha)" rx="16" />
  <rect width="1200" height="360" fill="url(#celestial-grid-light)" rx="16" />

  <!-- Outer Hairline Frame in Cosmic Latte -->
  <rect x="1" y="1" width="1198" height="358" fill="none" stroke="#D1C0AA" stroke-width="1.5" rx="15" />

  <!-- Ambient Burgundy Glow on Right -->
  <circle cx="975" cy="180" r="190" fill="url(#burgundy-ambient)" />

  <!-- Twinkling Celestial Stars (✦) -->
  <g fill="#722F37" class="twinkle-1">
    <text x="940" y="120" font-size="22" text-anchor="middle">✦</text>
  </g>
  <g fill="#B7A89A" class="twinkle-2">
    <text x="1090" y="70" font-size="16" text-anchor="middle">✦</text>
  </g>
  <g fill="#722F37" class="twinkle-3">
    <text x="820" y="270" font-size="20" text-anchor="middle">✦</text>
  </g>

  <!-- Technical Corner Crosshairs -->
  <g stroke="#B7A89A" stroke-width="1.2">
    <path d="M 30 25 L 45 25 M 37.5 17.5 L 37.5 32.5" />
    <path d="M 1155 25 L 1170 25 M 1162.5 17.5 L 1162.5 32.5" />
    <path d="M 30 335 L 45 335 M 37.5 327.5 L 37.5 342.5" />
    <path d="M 1155 335 L 1170 335 M 1162.5 327.5 L 1162.5 342.5" />
  </g>

  <!-- Main Hero Area: Big Bold Name + Single-Line Role -->
  <g transform="translate(80, 155)">
    <!-- BIG BOLD NAME: PRANOV PRAHALADH -->
    <text x="0" y="30" fill="#241117" class="hero-name" font-size="74">PRANOV PRAHALADH</text>

    <!-- What I Do in a Single Line: UI/UX Designer & Frontend Developer -->
    <text x="0" y="82" fill="#722F37" class="hero-role" font-size="22" letter-spacing="1.5">UI/UX DESIGNER &amp; FRONTEND DEVELOPER</text>
  </g>

  <!-- Tactile Audio Hardware Pod (Right Side Widget) -->
  <g transform="translate(850, 139)">
    <!-- Pod Outer Shell -->
    <rect x="0" y="0" width="270" height="82" rx="41" fill="url(#pod-light-grad)" stroke="#C7B49D" stroke-width="1.5" />
    <rect x="3" y="3" width="264" height="76" rx="38" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.6" />

    <!-- Left Rotating Turntable Disc -->
    <g class="turntable-spin-left">
      <circle cx="41" cy="41" r="28" fill="#2A141D" stroke="#542B39" stroke-width="1" />
      <circle cx="41" cy="41" r="18" fill="#3D1D28" stroke="#722F37" stroke-width="0.8" />
      <circle cx="41" cy="41" r="6" fill="#E8DCC6" />
      <line x1="41" y1="13" x2="41" y2="21" stroke="#FAF6EE" stroke-width="1.5" />
    </g>

    <!-- Center OLED Mini Screen -->
    <rect x="82" y="22" width="106" height="38" rx="5" fill="#2A141D" stroke="#4D2735" stroke-width="0.8" />
    <text x="92" y="36" fill="#E8DCC6" class="mono" font-size="8" letter-spacing="0.5" font-weight="700">CURRENTLY // FOCUS</text>
    <text x="92" y="51" fill="#FAF6EE" class="mono" font-size="9" font-weight="700">MOTION &amp; SYSTEMS</text>

    <!-- Right Rotating Turntable Disc -->
    <g class="turntable-spin-right">
      <circle cx="229" cy="41" r="28" fill="#2A141D" stroke="#542B39" stroke-width="1" />
      <line x1="229" y1="13" x2="229" y2="21" stroke="#FAF6EE" stroke-width="1.5" />
    </g>

    <!-- Animated Equalizer Inside Right Speaker -->
    <g transform="translate(216, 28)" fill="#722F37">
      <rect x="0" y="12" width="3" height="12" rx="1" class="eq1" />
      <rect x="6" y="8" width="3" height="16" rx="1" class="eq2" />
      <rect x="12" y="4" width="3" height="20" rx="1" class="eq3" />
      <rect x="18" y="10" width="3" height="14" rx="1" class="eq4" />
      <rect x="24" y="14" width="3" height="10" rx="1" class="eq5" />
    </g>
  </g>
</svg>