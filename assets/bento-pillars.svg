<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="auto">
  <defs>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#101217" />
      <stop offset="100%" stop-color="#0A0B0E" />
    </linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&amp;family=Space+Mono:wght@400;700&amp;display=swap');

      .mono { font-family: 'Space Mono', monospace; }
      .grotesk { font-family: 'Space Grotesk', -apple-system, sans-serif; }

      .card-box {
        transition: all 0.3s ease;
      }
      
      .spin-slow {
        animation: spinCube 20s linear infinite;
        transform-origin: 140px 105px;
      }
      @keyframes spinCube {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .pulse-target {
        animation: targetPulse 3s ease-in-out infinite alternate;
        transform-origin: 140px 105px;
      }
      @keyframes targetPulse {
        0% { transform: scale(0.96); opacity: 0.7; }
        100% { transform: scale(1.04); opacity: 1; }
      }
    </style>
  </defs>

  <!-- ==================== CARD 001 ==================== -->
  <g transform="translate(0, 0)">
    <rect width="285" height="480" rx="12" fill="url(#card-grad)" stroke="#1F232D" stroke-width="1.2" />
    <!-- Index -->
    <text x="24" y="38" fill="#5A6170" class="mono" font-size="12" font-weight="700">001</text>
    
    <!-- Wireframe Art 001: Concentric Precision Rings -->
    <g transform="translate(0, 10)">
      <circle cx="142" cy="110" r="48" fill="none" stroke="#2B3240" stroke-width="1.2" />
      <circle cx="142" cy="110" r="34" fill="none" stroke="#3D4659" stroke-width="1.4" class="pulse-target" />
      <circle cx="142" cy="110" r="20" fill="none" stroke="#22EC4A" stroke-width="1.6" />
      <circle cx="142" cy="110" r="4" fill="#22EC4A" />
      <!-- Radial axes lines -->
      <line x1="142" y1="52" x2="142" y2="168" stroke="#1D222B" stroke-width="1" />
      <line x1="84" y1="110" x2="200" y2="110" stroke="#1D222B" stroke-width="1" />
    </g>

    <!-- Content -->
    <g transform="translate(24, 250)">
      <text x="0" y="0" fill="#FFFFFF" class="grotesk" font-size="22" font-weight="700">UX Architecture</text>
      <text x="0" y="26" fill="#22EC4A" class="grotesk" font-size="13" font-weight="600">Understand before building.</text>
      <text x="0" y="65" fill="#848C9E" class="grotesk" font-size="13" line-height="1.5">
        <tspan x="0" dy="0">I decompose user journeys</tspan>
        <tspan x="0" dy="20">into coherent state flows,</tspan>
        <tspan x="0" dy="20">eliminating guesswork and</tspan>
        <tspan x="0" dy="20">unnecessary friction.</tspan>
      </text>
    </g>
  </g>

  <!-- ==================== CARD 002 ==================== -->
  <g transform="translate(305, 0)">
    <rect width="285" height="480" rx="12" fill="url(#card-grad)" stroke="#1F232D" stroke-width="1.2" />
    <!-- Index -->
    <text x="24" y="38" fill="#5A6170" class="mono" font-size="12" font-weight="700">002</text>
    
    <!-- Wireframe Art 002: Isometric Nested Cube -->
    <g transform="translate(0, 10)">
      <!-- Outer Cube -->
      <path d="M 142 62 L 186 86 L 186 136 L 142 160 L 98 136 L 98 86 Z" fill="none" stroke="#323A4A" stroke-width="1.2" />
      <path d="M 142 62 L 142 112 L 186 136" fill="none" stroke="#252B37" stroke-width="1.2" />
      <path d="M 142 112 L 98 136" fill="none" stroke="#252B37" stroke-width="1.2" />

      <!-- Inner Tilted Highlight Cube -->
      <g transform="translate(142, 110)">
        <path d="M 0 -18 L 18 -6 L 18 16 L 0 26 L -18 16 L -18 -6 Z" fill="none" stroke="#22EC4A" stroke-width="1.5" />
        <path d="M 0 -18 L 0 4 L 18 16" fill="none" stroke="#22EC4A" stroke-width="1" />
        <path d="M 0 4 L -18 16" fill="none" stroke="#22EC4A" stroke-width="1" />
      </g>
    </g>

    <!-- Content -->
    <g transform="translate(24, 250)">
      <text x="0" y="0" fill="#FFFFFF" class="grotesk" font-size="22" font-weight="700">Design Systems</text>
      <text x="0" y="26" fill="#22EC4A" class="grotesk" font-size="13" font-weight="600">Tokens, scales &amp; precision.</text>
      <text x="0" y="65" fill="#848C9E" class="grotesk" font-size="13" line-height="1.5">
        <tspan x="0" dy="0">Modular component libraries</tspan>
        <tspan x="0" dy="20">and atomic token pipelines</tspan>
        <tspan x="0" dy="20">that bridge Figma directly</tspan>
        <tspan x="0" dy="20">into production code.</tspan>
      </text>
    </g>
  </g>

  <!-- ==================== CARD 003 ==================== -->
  <g transform="translate(610, 0)">
    <rect width="285" height="480" rx="12" fill="url(#card-grad)" stroke="#1F232D" stroke-width="1.2" />
    <!-- Index -->
    <text x="24" y="38" fill="#5A6170" class="mono" font-size="12" font-weight="700">003</text>
    
    <!-- Wireframe Art 003: Isometric Bento Modular Layout -->
    <g transform="translate(0, 10)">
      <!-- Bento wireframe planes -->
      <g stroke="#323A4A" stroke-width="1.2" fill="none">
        <rect x="100" y="65" width="38" height="26" rx="2" />
        <rect x="144" y="65" width="44" height="26" rx="2" />
        <rect x="100" y="97" width="44" height="48" rx="2" stroke="#22EC4A" stroke-width="1.5" />
        <rect x="150" y="97" width="38" height="22" rx="2" />
        <rect x="150" y="125" width="38" height="20" rx="2" />
      </g>
      <!-- Connection dotted line -->
      <path d="M 85 120 L 100 120" stroke="#22EC4A" stroke-width="1.2" stroke-dasharray="2 2" />
      <circle cx="85" cy="120" r="3" fill="#22EC4A" />
    </g>

    <!-- Content -->
    <g transform="translate(24, 250)">
      <text x="0" y="0" fill="#FFFFFF" class="grotesk" font-size="22" font-weight="700">Creative Frontend</text>
      <text x="0" y="26" fill="#22EC4A" class="grotesk" font-size="13" font-weight="600">Motion, Three.js &amp; Next.js.</text>
      <text x="0" y="65" fill="#848C9E" class="grotesk" font-size="13" line-height="1.5">
        <tspan x="0" dy="0">Writing clean TypeScript</tspan>
        <tspan x="0" dy="20">and Framer Motion physics</tspan>
        <tspan x="0" dy="20">where every transition</tspan>
        <tspan x="0" dy="20">feels natural and crisp.</tspan>
      </text>
    </g>
  </g>

  <!-- ==================== CARD 004 ==================== -->
  <g transform="translate(915, 0)">
    <rect width="285" height="480" rx="12" fill="url(#card-grad)" stroke="#1F232D" stroke-width="1.2" />
    <!-- Index -->
    <text x="24" y="38" fill="#5A6170" class="mono" font-size="12" font-weight="700">004</text>
    
    <!-- Wireframe Art 004: Isometric L-Prism Extrusion -->
    <g transform="translate(0, 10)">
      <!-- Isometric Extruded Prism -->
      <g stroke="#384254" stroke-width="1.2" fill="none">
        <path d="M 110 80 L 135 65 L 175 90 L 175 140 L 150 155 L 110 130 Z" />
        <path d="M 135 65 L 135 115 L 175 140" stroke="#22EC4A" stroke-width="1.5" />
        <path d="M 135 115 L 110 130" stroke="#22EC4A" stroke-width="1.5" />
        <!-- Inner fold -->
        <path d="M 148 74 L 148 124 L 164 133" stroke="#212630" stroke-width="1" />
      </g>
    </g>

    <!-- Content -->
    <g transform="translate(24, 250)">
      <text x="0" y="0" fill="#FFFFFF" class="grotesk" font-size="22" font-weight="700">Accessibility &amp; A11y</text>
      <text x="0" y="26" fill="#22EC4A" class="grotesk" font-size="13" font-weight="600">Built for every user.</text>
      <text x="0" y="65" fill="#848C9E" class="grotesk" font-size="13" line-height="1.5">
        <tspan x="0" dy="0">Fully WCAG-compliant,</tspan>
        <tspan x="0" dy="20">keyboard navigable, and</tspan>
        <tspan x="0" dy="20">screen-reader optimized</tspan>
        <tspan x="0" dy="20">without visual compromise.</tspan>
      </text>
    </g>
  </g>
</svg>
