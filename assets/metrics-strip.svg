<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="auto">
  <defs>
    <linearGradient id="metric-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090A0E" />
      <stop offset="100%" stop-color="#0D0F14" />
    </linearGradient>

    <!-- Acid Lime Vibrant Box Gradient -->
    <linearGradient id="lime-box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28F451" />
      <stop offset="50%" stop-color="#21EA49" />
      <stop offset="100%" stop-color="#1AD13F" />
    </linearGradient>

    <radialGradient id="lime-internal-glow" cx="20%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#B6FF47" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#21EA49" stop-opacity="0" />
    </radialGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=Space+Mono:wght@400;700&amp;display=swap');

      .num { font-family: 'Space Grotesk', -apple-system, sans-serif; font-weight: 700; }
      .mono { font-family: 'Space Mono', monospace; }
      .desc { font-family: 'Space Grotesk', -apple-system, sans-serif; font-size: 13px; line-height: 1.4; }

      .pulse-ring {
        animation: ringPulse 4s infinite ease-out;
        transform-origin: 940px 220px;
      }
      @keyframes ringPulse {
        0% { transform: scale(0.8); opacity: 0.8; }
        50% { transform: scale(1.15); opacity: 0.3; }
        100% { transform: scale(0.8); opacity: 0.8; }
      }
    </style>
  </defs>

  <!-- Container -->
  <rect width="1200" height="280" fill="url(#metric-bg)" rx="14" />
  <rect x="1" y="1" width="1198" height="278" fill="none" stroke="#1F232C" stroke-width="1.5" rx="13" />

  <!-- Divider Lines -->
  <line x1="300" y1="30" x2="300" y2="250" stroke="#1C2028" stroke-width="1.2" />
  <line x1="600" y1="30" x2="600" y2="250" stroke="#1C2028" stroke-width="1.2" />
  <line x1="900" y1="30" x2="900" y2="250" stroke="#1C2028" stroke-width="1.2" />

  <!-- ==================== COLUMN 1 ==================== -->
  <g transform="translate(45, 60)">
    <!-- Number + Unit -->
    <text x="0" y="80" fill="#FFFFFF" class="num" font-size="92" letter-spacing="-2">04</text>
    <text x="122" y="24" fill="#6B7280" class="mono" font-size="12" font-weight="700" letter-spacing="1">YEARS</text>
    <!-- Description -->
    <text x="0" y="132" fill="#8E95A5" class="desc" width="220">
      Crafting responsive design systems
    </text>
    <text x="0" y="152" fill="#8E95A5" class="desc">
      and production web applications.
    </text>
  </g>

  <!-- ==================== COLUMN 2 ==================== -->
  <g transform="translate(345, 60)">
    <!-- Number + Unit -->
    <text x="0" y="80" fill="#FFFFFF" class="num" font-size="92" letter-spacing="-2">25<tspan fill="#22EC4A">+</tspan></text>
    <text x="145" y="24" fill="#6B7280" class="mono" font-size="12" font-weight="700" letter-spacing="1">PROJECTS</text>
    <!-- Description -->
    <text x="0" y="132" fill="#8E95A5" class="desc">
      Engineered across creative tooling,
    </text>
    <text x="0" y="152" fill="#8E95A5" class="desc">
      SaaS dashboards &amp; 3D web apps.
    </text>
  </g>

  <!-- ==================== COLUMN 3 ==================== -->
  <g transform="translate(645, 60)">
    <!-- Number + Unit -->
    <text x="0" y="80" fill="#FFFFFF" class="num" font-size="92" letter-spacing="-2">100<tspan font-size="54">%</tspan></text>
    <text x="180" y="24" fill="#6B7280" class="mono" font-size="12" font-weight="700" letter-spacing="1">WCAG</text>
    <!-- Description -->
    <text x="0" y="132" fill="#8E95A5" class="desc">
      Strict adherence to accessibility,
    </text>
    <text x="0" y="152" fill="#8E95A5" class="desc">
      semantic HTML &amp; 60fps interaction.
    </text>
  </g>

  <!-- ==================== COLUMN 4 (ACID LIME BLOCK) ==================== -->
  <!-- Card Background -->
  <rect x="914" y="14" width="272" height="252" rx="10" fill="url(#lime-box)" />
  <rect x="914" y="14" width="272" height="252" rx="10" fill="url(#lime-internal-glow)" />

  <!-- Animated Ambient Ring in Card -->
  <circle cx="950" cy="225" r="32" fill="none" stroke="#128527" stroke-width="1.5" opacity="0.6" class="pulse-ring" />
  <circle cx="950" cy="225" r="14" fill="#15992E" opacity="0.4" />

  <g transform="translate(940, 60)">
    <!-- Number + Unit -->
    <text x="0" y="80" fill="#080A0C" class="num" font-size="92" letter-spacing="-3">6k<tspan font-size="56">+</tspan></text>
    <text x="145" y="24" fill="#0E4218" class="mono" font-size="12" font-weight="700" letter-spacing="1">HOURS</text>
    <!-- Description in Dark Contrast -->
    <text x="0" y="132" fill="#0C2612" class="desc" font-weight="700">
      Deep UX research, fluid prototyping,
    </text>
    <text x="0" y="152" fill="#0C2612" class="desc" font-weight="700">
      and frontend interaction craft.
    </text>
  </g>
</svg>
