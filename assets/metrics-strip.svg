<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="auto">
  <defs>
    <!-- Background Gradient: Light Mocha Cream -->
    <linearGradient id="metric-light-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F2E8" />
      <stop offset="100%" stop-color="#EFE4D3" />
    </linearGradient>

    <!-- Deep Burgundy Luxury Highlight Card Gradient -->
    <linearGradient id="burgundy-card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C3B45" />
      <stop offset="50%" stop-color="#722F37" />
      <stop offset="100%" stop-color="#551F26" />
    </linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=Space+Mono:wght@400;700&amp;display=swap');

      .num { font-family: 'Space Grotesk', -apple-system, sans-serif; font-weight: 700; }
      .mono { font-family: 'Space Mono', monospace; }
      .desc { font-family: 'Space Grotesk', -apple-system, sans-serif; font-size: 13px; line-height: 1.4; }

      /* Pulse Ring Animation */
      .pulse-ring-1 {
        animation: ringPulse1 3.5s infinite ease-out;
        transform-origin: 950px 225px;
      }
      .pulse-ring-2 {
        animation: ringPulse2 3.5s infinite ease-out 1.2s;
        transform-origin: 950px 225px;
      }
      @keyframes ringPulse1 {
        0% { transform: scale(0.6); opacity: 0.9; }
        60% { transform: scale(1.3); opacity: 0.15; }
        100% { transform: scale(1.5); opacity: 0; }
      }
      @keyframes ringPulse2 {
        0% { transform: scale(0.6); opacity: 0.9; }
        60% { transform: scale(1.3); opacity: 0.15; }
        100% { transform: scale(1.5); opacity: 0; }
      }

      /* Floating Star */
      .star-float {
        animation: starFloat 3s infinite ease-in-out alternate;
        transform-origin: 1140px 50px;
      }
      @keyframes starFloat {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-6px) rotate(45deg); }
      }
    </style>
  </defs>

  <!-- Container Base with Light Mocha Cream -->
  <rect width="1200" height="280" fill="url(#metric-light-bg)" rx="14" />
  <rect x="1" y="1" width="1198" height="278" fill="none" stroke="#D6C4AE" stroke-width="1.5" rx="13" />

  <!-- Divider Lines in Cosmic Latte Tone -->
  <line x1="300" y1="30" x2="300" y2="250" stroke="#D6C4AE" stroke-width="1.2" />
  <line x1="600" y1="30" x2="600" y2="250" stroke="#D6C4AE" stroke-width="1.2" />
  <line x1="900" y1="30" x2="900" y2="250" stroke="#D6C4AE" stroke-width="1.2" />

  <!-- ==================== COLUMN 1 (Pranov's Focus Areas) ==================== -->
  <g transform="translate(45, 60)">
    <!-- Number + Unit -->
    <text x="0" y="80" fill="#241117" class="num" font-size="92" letter-spacing="-2">03</text>
    <text x="122" y="24" fill="#722F37" class="mono" font-size="12" font-weight="700" letter-spacing="1">DOMAINS</text>
    <!-- Description from Pranov's learning array -->
    <text x="0" y="132" fill="#241117" class="desc" font-weight="600">
      Motion Design, Design Systems
    </text>
    <text x="0" y="152" fill="#785A48" class="desc">
      and polished micro-interactions.
    </text>
  </g>

  <!-- ==================== COLUMN 2 (Pranov's Full Capabilities) ==================== -->
  <g transform="translate(345, 60)">
    <!-- Number + Unit -->
    <text x="0" y="80" fill="#241117" class="num" font-size="92" letter-spacing="-2">08<tspan fill="#722F37">+</tspan></text>
    <text x="145" y="24" fill="#722F37" class="mono" font-size="12" font-weight="700" letter-spacing="1">STACKS</text>
    <!-- Description from Pranov's skills list -->
    <text x="0" y="132" fill="#241117" class="desc" font-weight="600">
      Languages, Interfaces, Backend APIs,
    </text>
    <text x="0" y="152" fill="#785A48" class="desc">
      Databases, Cloud &amp; Design tools.
    </text>
  </g>

  <!-- ==================== COLUMN 3 (Pranov's Philosophy) ==================== -->
  <g transform="translate(645, 60)">
    <!-- Number + Unit -->
    <text x="0" y="80" fill="#241117" class="num" font-size="92" letter-spacing="-2">100<tspan font-size="54" fill="#722F37">%</tspan></text>
    <text x="180" y="24" fill="#722F37" class="mono" font-size="12" font-weight="700" letter-spacing="1">CODE &amp; UX</text>
    <!-- Description -->
    <text x="0" y="132" fill="#241117" class="desc" font-weight="600">
      Design is not how it looks.
    </text>
    <text x="0" y="152" fill="#785A48" class="desc">
      It is fundamentally how it works.
    </text>
  </g>

  <!-- ==================== COLUMN 4 (Pranov's Stealth Mode / Fun Fact) ==================== -->
  <!-- Card Background in Deep Burgundy -->
  <rect x="914" y="14" width="272" height="252" rx="10" fill="url(#burgundy-card-grad)" />

  <!-- Animated Celestial Pulse Rings -->
  <circle cx="950" cy="225" r="26" fill="none" stroke="#FAF6EE" stroke-width="1.5" class="pulse-ring-1" />
  <circle cx="950" cy="225" r="16" fill="none" stroke="#FAF6EE" stroke-width="1.2" class="pulse-ring-2" />
  <circle cx="950" cy="225" r="6" fill="#FAF6EE" />

  <!-- Floating Star -->
  <g class="star-float">
    <text x="1140" y="50" fill="#FAF6EE" font-size="20" text-anchor="middle">✦</text>
  </g>

  <g transform="translate(940, 60)">
    <!-- Stealth Mode Title from main -->
    <text x="0" y="80" fill="#FAF6EE" class="num" font-size="78" letter-spacing="-2">STEALTH</text>
    <text x="160" y="24" fill="#E8DCC6" class="mono" font-size="11" font-weight="700" letter-spacing="1">MODE</text>
    <!-- Description from Pranov's funFact and git log in main -->
    <text x="0" y="132" fill="#FAF6EE" class="desc" font-weight="600">
      Debug at midnight, ship at sunrise.
    </text>
    <text x="0" y="152" fill="#E8DCC6" class="desc" font-weight="600">
      Commits classified in private repos.
    </text>
  </g>
</svg>
