<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="auto">
  <defs>
    <!-- Background Gradient: Light Mocha Cream -->
    <linearGradient id="metric-light-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F3EA" />
      <stop offset="100%" stop-color="#EFE4D3" />
    </linearGradient>

    <!-- Deep Burgundy Luxury Highlight Card Gradient -->
    <linearGradient id="burgundy-card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#87353F" />
      <stop offset="50%" stop-color="#722F37" />
      <stop offset="100%" stop-color="#521D24" />
    </linearGradient>

    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800;900&family=Space+Mono:wght@700&display=swap');

      .heavy-num {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
        letter-spacing: -3px;
      }
      .mono-tag {
        font-family: 'Space Mono', 'SFMono-Regular', Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.5px;
      }
      .metric-label {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 1px;
        text-transform: uppercase;
      }
      .body-desc {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.45;
      }

      /* Animated Pulsing Rings in Burgundy Card */
      .pulse-ring-1 {
        animation: ringPulse1 3.5s infinite ease-out;
        transform-origin: 955px 225px;
      }
      .pulse-ring-2 {
        animation: ringPulse2 3.5s infinite ease-out 1.2s;
        transform-origin: 955px 225px;
      }
      @keyframes ringPulse1 {
        0% { transform: scale(0.6); opacity: 0.9; }
        60% { transform: scale(1.35); opacity: 0.2; }
        100% { transform: scale(1.55); opacity: 0; }
      }
      @keyframes ringPulse2 {
        0% { transform: scale(0.6); opacity: 0.9; }
        60% { transform: scale(1.35); opacity: 0.2; }
        100% { transform: scale(1.55); opacity: 0; }
      }

      /* Subtle Floating Star */
      .star-float {
        animation: starLevitate 3s infinite ease-in-out alternate;
        transform-origin: 1146px 48px;
      }
      @keyframes starLevitate {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-5px) rotate(45deg); }
      }
    ]]></style>
  </defs>

  <!-- Container Base with Light Mocha Cream -->
  <rect width="1200" height="280" fill="url(#metric-light-bg)" rx="14" />
  <rect x="1" y="1" width="1198" height="278" fill="none" stroke="#D6C4AE" stroke-width="1.5" rx="13" />

  <!-- Divider Lines in Cosmic Latte Tone with Swiss Crosshair Anchors -->
  <line x1="300" y1="24" x2="300" y2="256" stroke="#D6C4AE" stroke-width="1.2" />
  <text x="300" y="22" fill="#B7A89A" font-family="monospace" font-size="12" text-anchor="middle">+</text>
  <text x="300" y="268" fill="#B7A89A" font-family="monospace" font-size="12" text-anchor="middle">+</text>

  <line x1="600" y1="24" x2="600" y2="256" stroke="#D6C4AE" stroke-width="1.2" />
  <text x="600" y="22" fill="#B7A89A" font-family="monospace" font-size="12" text-anchor="middle">+</text>
  <text x="600" y="268" fill="#B7A89A" font-family="monospace" font-size="12" text-anchor="middle">+</text>

  <line x1="900" y1="24" x2="900" y2="256" stroke="#D6C4AE" stroke-width="1.2" />
  <text x="900" y="22" fill="#B7A89A" font-family="monospace" font-size="12" text-anchor="middle">+</text>
  <text x="900" y="268" fill="#B7A89A" font-family="monospace" font-size="12" text-anchor="middle">+</text>

  <!-- ==================== COLUMN 1: EXPERIENCE / CRAFT ==================== -->
  <g transform="translate(42, 38)">
    <!-- Top Index & Category Badge -->
    <text x="0" y="14" fill="#886D5B" class="mono-tag">// 01 CRAFT</text>
    
    <!-- Ultra Bold Large Number -->
    <text x="0" y="98" fill="#241117" class="heavy-num" font-size="88">04<tspan fill="#722F37">+</tspan></text>
    
    <!-- Bold Sub-label -->
    <text x="0" y="128" fill="#722F37" class="metric-label">YEARS ACTIVE</text>
    
    <!-- Crisp Meaningful Description -->
    <text x="0" y="158" fill="#3D2028" class="body-desc">
      Frontend engineering, design systems,
    </text>
    <text x="0" y="178" fill="#785A48" class="body-desc">
      and responsive full-stack architectures.
    </text>
  </g>

  <!-- ==================== COLUMN 2: PRODUCTION PROJECTS ==================== -->
  <g transform="translate(342, 38)">
    <!-- Top Index & Category Badge -->
    <text x="0" y="14" fill="#886D5B" class="mono-tag">// 02 SHIPPED</text>
    
    <!-- Ultra Bold Large Number -->
    <text x="0" y="98" fill="#241117" class="heavy-num" font-size="88">30<tspan fill="#722F37">+</tspan></text>
    
    <!-- Bold Sub-label -->
    <text x="0" y="128" fill="#722F37" class="metric-label">BUILT &amp; DEPLOYED</text>
    
    <!-- Crisp Meaningful Description -->
    <text x="0" y="158" fill="#3D2028" class="body-desc">
      Full-stack web apps, SaaS dashboards,
    </text>
    <text x="0" y="178" fill="#785A48" class="body-desc">
      REST APIs and creative tooling.
    </text>
  </g>

  <!-- ==================== COLUMN 3: MOTION & FIDELITY ==================== -->
  <g transform="translate(642, 38)">
    <!-- Top Index & Category Badge -->
    <text x="0" y="14" fill="#886D5B" class="mono-tag">// 03 FIDELITY</text>
    
    <!-- Ultra Bold Large Number -->
    <text x="0" y="98" fill="#241117" class="heavy-num" font-size="88">60<tspan font-size="52" fill="#722F37">FPS</tspan></text>
    
    <!-- Bold Sub-label -->
    <text x="0" y="128" fill="#722F37" class="metric-label">KINETIC MOTION</text>
    
    <!-- Crisp Meaningful Description -->
    <text x="0" y="158" fill="#3D2028" class="body-desc">
      Kinetic physics, GSAP micro-animations,
    </text>
    <text x="0" y="178" fill="#785A48" class="body-desc">
      WebGL canvases &amp; pixel perfection.
    </text>
  </g>

  <!-- ==================== COLUMN 4: DEEP BURGUNDY HIGHLIGHT CARD ==================== -->
  <!-- Card Background with Rounded Corners -->
  <rect x="914" y="14" width="272" height="252" rx="10" fill="url(#burgundy-card-grad)" />
  <rect x="915" y="15" width="270" height="250" rx="9" fill="none" stroke="rgba(250, 246, 238, 0.2)" stroke-width="1" />

  <!-- Animated Celestial Concentric Rings -->
  <circle cx="955" cy="225" r="26" fill="none" stroke="#FAF6EE" stroke-width="1.5" class="pulse-ring-1" />
  <circle cx="955" cy="225" r="16" fill="none" stroke="#FAF6EE" stroke-width="1.2" class="pulse-ring-2" />
  <circle cx="955" cy="225" r="5" fill="#FAF6EE" />

  <!-- Floating Star -->
  <g class="star-float">
    <text x="1146" y="48" fill="#FAF6EE" font-size="20" text-anchor="middle">✦</text>
  </g>

  <g transform="translate(942, 38)">
    <!-- Top Index & Category Badge -->
    <text x="0" y="14" fill="#E8DCC6" class="mono-tag">// 04 DEDICATION</text>
    
    <!-- Ultra Bold Large Number (Short & punchy, no clipping) -->
    <text x="0" y="98" fill="#FAF6EE" class="heavy-num" font-size="88">6k<tspan font-size="56" fill="#FAF6EE">+</tspan></text>
    
    <!-- Bold Sub-label -->
    <text x="0" y="128" fill="#FAF6EE" class="metric-label">HOURS IN THE CRAFT</text>
    
    <!-- Crisp Meaningful Description -->
    <text x="0" y="158" fill="#FAF6EE" class="body-desc">
      Design in Figma, code in VS Code,
    </text>
    <text x="0" y="178" fill="#E8DCC6" class="body-desc">
      debug at 2 AM &amp; ship before sunrise.
    </text>
  </g>
</svg>